name: Env Reproducibility Check

on:
  push:
    branches: [ main ]     # main에 푸시될 때 실행
  workflow_dispatch:        # Actions 화면에서 수동 실행 버튼

jobs:
  reproducible-env:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.14"
      - name: Create venv & install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt
          pip freeze | sort > freeze.txt
          sha256sum freeze.txt | awk '{print $1}' > freeze.hash
          cat freeze.hash
      - uses: actions/upload-artifact@v4
        with:
          name: reproducible-env
          path: |
            freeze.txt
            freeze.hash
