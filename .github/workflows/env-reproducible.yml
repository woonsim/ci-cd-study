name: Env Reproducibility Check

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/env-reproducible.yml"
      - "requirements.txt"
      - "scripts/**"
  workflow_dispatch:

jobs:
  reproducible-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python (pin version)
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies (from requirements.txt)
        run: pip install -r requirements.txt

      - name: Verify env (print versions)
        run: python scripts/env_check.py

      - name: Freeze & hash (deterministic)
        run: |
          pip freeze | sort > freeze.txt
          sha256sum freeze.txt | awk '{print $1}' > freeze.hash
          echo "Freeze hash:"
          cat freeze.hash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reproducible-env
          path: |
            freeze.txt
            freeze.hash
