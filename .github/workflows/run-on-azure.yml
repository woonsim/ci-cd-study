name: Run Training on Azure (with cnstark/pytorch base)

on:
  workflow_dispatch:   # 수동 실행
  push:
    branches:
      - main           # main 브랜치에 push 시 자동 실행

jobs:
  train:
    runs-on: [self-hosted, linux]   # Azure VM runner 사용

    steps:
      # 1️⃣ 코드 내려받기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ 베이스 이미지 받기
      - name: Pull PyTorch base image
        run: docker pull cnstark/pytorch:2.3.1-py3.10.15-cuda12.1.0-ubuntu22.04

      # 3️⃣ 학습 스크립트 실행
      - name: Run training inside Docker (root, cache outside repo)
        run: |
          mkdir -p outputs
          mkdir -p ${{ runner.temp }}/hf  # 리포 바깥 캐시 경로

          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v ${{ runner.temp }}/hf:/root/.cache/huggingface \
            -w /workspace \
            cnstark/pytorch:2.3.1-py3.10.15-cuda12.1.0-ubuntu22.04 \
            bash -lc "python -m pip install -q --upgrade pip && \
                      pip install --root-user-action=ignore -q transformers==4.44.0 Pillow==10.3.0 tqdm==4.66.5 timm==1.0.9 && \
                      SMOKE_STEPS=10 python scripts/train_smoke_detr.py"



      # 4️⃣ 학습 결과 업로드
      - name: Upload outputs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-outputs
          path: outputs/
